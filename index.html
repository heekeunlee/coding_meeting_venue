<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주말 코딩 모임 장소 추천 (성복역 10km 이내 대형 카페)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        #map { height: 500px; width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .highlight { font-weight: bold; color: #e67e22; }
        .rank-1 { background-color: #fff9c4; }
        .rank-2 { background-color: #f1f8e9; }
        .rank-3 { background-color: #e3f2fd; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
        .badge-free { background: #27ae60; color: white; }
        .badge-large { background: #2980b9; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>주말 코딩 모임 장소 (성복역 10km 이내 남부 대형 카페)</h1>
        <p>무료주차 & 대규모 좌석 최우선 분석 결과 (스타벅스 포함 전체 확장)</p>
    </header>
    <div class="container">
        <div id="map"></div>
        
        <div class="card">
            <h2>🔍 감지된 전체 카페 분석 리스트</h2>
            <p style="font-size: 0.9em; color: #666;">*성복역 남쪽(위도 낮음) 수원/용인 지역, 주차/좌석 기준 정렬</p>
            <table>
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>카페명</th>
                        <th>유형</th>
                        <th>주차 편의성</th>
                        <th>좌석 규모</th>
                        <th>노트북 환경</th>
                        <th>총점</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Data will be populated by JS -->
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>🏆 최종 추천 Best 3 근거</h2>
            <div id="recommendations"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const venues = [
            { 
                name: '리드엑스 (ReadX)', type: '북카페', lat: 37.2474, lng: 127.0783, 
                parking: '5시간 무료 (강력)', seats: '대규모 (작업특화)', 
                laptop: '최상 (콘센트 풍부)', score: 9.8,
                desc: '기흥 영통로에 위치한 작업 특화 카페입니다. 음료 구매 시 5시간 주차 지원이라는 파격적인 혜택과 도서관 같은 분위기로 코딩 모임에 가장 적합합니다.'
            },
            { 
                name: '광교SK뷰레이크41F점', type: '스타벅스', lat: 37.2888, lng: 127.0677, 
                parking: '대규모 빌딩 (2시간+)', seats: '중대규모', 
                laptop: '우수 (뷰 맛집)', score: 9.3,
                desc: '주차가 매우 쾌적하며, 건물 내 타 매장 합산 시 3~4시간 무료 주차가 가능합니다. 고층 뷰가 좋아 분위기 있는 모임에 좋습니다.'
            },
            { 
                name: '하이라이트 (Highlight)', type: '베이커리', lat: 37.3032, lng: 127.0770, 
                parking: '자체 주차장 넓음', seats: '대규모 (층고 높음)', 
                laptop: '우수', score: 9.1,
                desc: '상현역 인근 대형 브런치 카페로 주차 공간이 넉넉하며 내부가 넓어 단체 모임과 노트북 작업이 모두 용이합니다.'
            },
            { 
                name: '호수앉기', type: '베이커리', lat: 37.2516, lng: 127.1141, 
                parking: '공영주차장 4시간무료', seats: '초대형 (4층)', 
                laptop: '보통 (주말혼잡)', score: 8.9,
                desc: '기흥호수공원 뷰가 환상적이며, 인근 공영주차장 4시간 무료 혜택이 강력하여 장시간 주차 부담이 없습니다.'
            },
            { 
                name: '르디투어', type: '베이커리', lat: 37.3121, lng: 127.0549, 
                parking: '전용 주차 (2시간)', seats: '대형 (계단식)', 
                laptop: '보통', score: 8.7,
                desc: '광교 외곽의 유명 카페로 공간감이 뛰어나지만 주말에는 주차가 다소 혼잡할 수 있습니다.'
            },
            { 
                name: '용인보라DT점', type: '스타벅스', lat: 37.2561, lng: 127.1153, 
                parking: '자체 넓음', seats: '중대형', 
                laptop: '우수', score: 8.5,
                desc: '전형적인 넓은 스타벅스 매장으로 익숙한 작업 환경과 주차 편의를 제공합니다.'
            },
            { 
                name: '수원영통점', type: '스타벅스', lat: 37.2500, lng: 127.0700, 
                parking: '빌딩 2시간 무료', seats: '중형', 
                laptop: '우수', score: 8.3,
                desc: '영통역 중심가에서 가장 주차가 편한 스타벅스로 식사 연계가 최상입니다.'
            }
        ];

        venues.sort((a, b) => b.score - a.score);

        const tbody = document.getElementById('table-body');
        venues.forEach((v, i) => {
            const tr = document.createElement('tr');
            if (i === 0) tr.className = 'rank-1';
            else if (i === 1) tr.className = 'rank-2';
            else if (i === 2) tr.className = 'rank-3';

            tr.innerHTML = `
                <td>${i + 1}</td>
                <td class="highlight">${v.name}</td>
                <td>${v.type}</td>
                <td>${v.parking}</td>
                <td>${v.seats}</td>
                <td>${v.laptop}</td>
                <td class="highlight">${v.score}</td>
            `;
            tbody.appendChild(tr);
        });

        const recDiv = document.getElementById('recommendations');
        venues.slice(0, 3).forEach((v, i) => {
            const item = document.createElement('div');
            item.innerHTML = `<h3>${i+1}. ${v.name} (${v.type})</h3><p>${v.desc}</p>`;
            recDiv.appendChild(item);
        });

        const map = L.map('map').setView([37.2800, 127.0850], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.marker([37.3134, 127.0725]).addTo(map).bindPopup('<b>성복역 (기준점)</b>');

        const cafeIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        venues.forEach(v => {
            L.marker([v.lat, v.lng], {icon: cafeIcon}).addTo(map)
                .bindPopup(`<b>${v.name}</b><br>주차: ${v.parking}<br>좌석: ${v.seats}`);
        });
    </script>
</body>
</html>
