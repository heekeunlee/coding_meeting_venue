<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주말 코딩 모임 장소 Top 20 (성복역 10km 이내)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f4f6f8; font-size: 14px; }
        header { background-color: #1a1a1a; color: white; padding: 15px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        #map { height: 450px; width: 100%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #333; color: white; position: sticky; top: 0; }
        .highlight { font-weight: bold; color: #d35400; }
        .rank-top { background-color: #fff9c4; font-weight: bold; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
        .badge-free { background: #27ae60; color: white; }
        .badge-info { background: #2980b9; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>주말 코딩 모임 장소 Top 20 (성복역 10km 이내 남부)</h1>
        <p>무료주차 & 대규모 좌석 & 작업 환경 종합 분석</p>
    </header>
    <div class="container">
        <div id="map"></div>
        
        <div class="card">
            <h2>🏆 코딩 모임 장소 추천 순위 (종합 20위)</h2>
            <table>
                <thead>
                    <tr>
                        <th>순위</th>
                        <th>카페명</th>
                        <th>유형</th>
                        <th>주차 혜택</th>
                        <th>좌석/환경</th>
                        <th>총점</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const venues = [
            { name: '리드엑스 (ReadX)', type: '북카페', lat: 37.2474, lng: 127.0783, parking: '5시간 무료', info: '작업 특화, 콘센트 다수', score: 9.9 },
            { name: '광교SK뷰레이크41F', type: '스타벅스', lat: 37.2888, lng: 127.0677, parking: '2~3시간 합산', info: '호수공원 뷰, 쾌적', score: 9.5 },
            { name: '포레스트 아우팅스 기흥', type: '초대형', lat: 37.2260, lng: 127.1089, parking: '무제한 무료', info: '식물원 컨셉, 매우 넓음', score: 9.4 },
            { name: '하이라이트', type: '베이커리', lat: 37.3032, lng: 127.0770, parking: '자체 주차장', info: '상현역 인근, 넓은 실내', score: 9.2 },
            { name: '호수앉기', type: '베이커리', lat: 37.2516, lng: 127.1141, parking: '공영 4시간', info: '기흥호수 뷰, 4층 규모', score: 9.1 },
            { name: '떼레노시떼 스페셜', type: '베이커리', lat: 37.2261, lng: 127.1090, parking: '넓은 자체주차', info: '고풍스러운 실내, 단체석', score: 9.0 },
            { name: '어반리프', type: '베이커리', lat: 37.2397, lng: 127.1111, parking: '대형 주차장', info: '온실형 카페, 개방감', score: 8.9 },
            { name: '르디투어', type: '베이커리', lat: 37.3121, lng: 127.0549, parking: '2시간 무료', info: '계단식 좌석, 건축물 우수', score: 8.8 },
            { name: '용인보라DT점', type: '스타벅스', lat: 37.2561, lng: 127.1153, parking: '자체 주차장', info: '카공하기 무난함', score: 8.7 },
            { name: '수원영통점', type: '스타벅스', lat: 37.2500, lng: 127.0700, parking: '빌딩 2시간', info: '영통역 중심 상권', score: 8.6 },
            { name: '테라로사 기흥', type: '대형', lat: 37.2259, lng: 127.1088, parking: '리빙파워센터', info: '세련된 인테리어', score: 8.5 },
            { name: '아리랑도원', type: '한옥베이커리', lat: 37.2262, lng: 127.1091, parking: '자체 주차', info: '이색적인 컨셉', score: 8.4 },
            { name: '어반리', type: '베이커리', lat: 37.2264, lng: 127.1106, parking: '전용 주차', info: '빈티지 감성, 넓음', score: 8.3 },
            { name: '동그란네모', type: '베이커리', lat: 37.2263, lng: 127.1092, parking: '전용 2곳', info: '고매동 인기 카페', score: 8.2 },
            { name: '용인마북DT점', type: '스타벅스', lat: 37.2966, lng: 127.1182, parking: 'DT 주차', info: '조용한 분위기', score: 8.1 },
            { name: '용인구성DT점', type: '스타벅스', lat: 37.3002, lng: 127.1068, parking: 'DT 주차', info: '접근성 좋음', score: 8.0 },
            { name: '용인흥덕DT점', type: '스타벅스', lat: 37.2762, lng: 127.0668, parking: 'DT 주차', info: '흥덕지구 중심', score: 7.9 },
            { name: '책발전소 광교', type: '북카페', lat: 37.2870, lng: 127.0590, parking: '앨리웨이', info: '독서/작업 최적', score: 7.8 },
            { name: '타임투비', type: '대형', lat: 37.3150, lng: 127.0750, parking: '전용 주차', info: '성복동 숲뷰, 공간분리', score: 7.7 },
            { name: '라임그라스', type: '대형', lat: 37.2550, lng: 127.1300, parking: '넓은 정원', info: '노트북존 운영', score: 7.6 }
        ];

        venues.sort((a, b) => b.score - a.score);

        const tbody = document.getElementById('table-body');
        venues.forEach((v, i) => {
            const tr = document.createElement('tr');
            if (i < 3) tr.className = 'rank-top';
            tr.innerHTML = `
                <td>${i + 1}</td>
                <td class="highlight">${v.name}</td>
                <td>${v.type}</td>
                <td><span class="badge badge-free">${v.parking}</span></td>
                <td><span class="badge badge-info">${v.info}</span></td>
                <td class="highlight">${v.score}</td>
            `;
            tbody.appendChild(tr);
        });

        const map = L.map('map').setView([37.2600, 127.0850], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        L.marker([37.3134, 127.0725]).addTo(map).bindPopup('<b>성복역 (기준점)</b>');

        const customIcon = (rank) => L.icon({
            iconUrl: rank < 3 ? 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png' : 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        venues.forEach((v, i) => {
            L.marker([v.lat, v.lng], {icon: customIcon(i)}).addTo(map)
                .bindPopup(`<b>${i+1}위: ${v.name}</b><br>주차: ${v.parking}<br>${v.info}`);
        });
    </script>
</body>
</html>
